spring:
  application:
    name: trainguard-backend

  datasource:
    url: jdbc:postgresql://localhost:5435/trainguard
    username: trainguard_user
    password: trainguard_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080